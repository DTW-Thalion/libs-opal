name: CoreGraphics oracle
on: push
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run the CoreGraphics probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_probe.m -o cg_probe
          ./cg_probe 2>&1
      - name: Compile and run the CGGeometry probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_geometry_probe.m -o cg_geometry_probe
          ./cg_geometry_probe 2>&1
      - name: Compile and run the CGColor probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_color_probe.m -o cg_color_probe
          ./cg_color_probe 2>&1
      - name: Compile and run the CGPath probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_path_probe.m -o cg_path_probe
          ./cg_path_probe 2>&1
      - name: Compile and run the CGGradient probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_gradient_probe.m -o cg_gradient_probe
          ./cg_gradient_probe 2>&1
      - name: Compile and run the CGColorSpace probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_colorspace_probe.m -o cg_colorspace_probe
          ./cg_colorspace_probe 2>&1
      - name: Compile and run the CGImage probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_image_probe.m -o cg_image_probe
          ./cg_image_probe 2>&1
      - name: Compile and run the CGContext probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_context_probe.m -o cg_context_probe
          ./cg_context_probe 2>&1
      - name: Compile and run the CGLayer probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_layer_probe.m -o cg_layer_probe
          ./cg_layer_probe 2>&1
      - name: Compile and run the image codec probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ImageIO -framework CoreFoundation \
            Tests/oracle/cg_codec_probe.m -o cg_codec_probe
          ./cg_codec_probe 2>&1
      - name: Compile and run the CGShading probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_shading_probe.m -o cg_shading_probe
          ./cg_shading_probe 2>&1
      - name: Compile and run the CGFont probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_font_probe.m -o cg_font_probe
          ./cg_font_probe 2>&1
      - name: Compile and run the line-attribute probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_line_probe.m -o cg_line_probe
          ./cg_line_probe 2>&1
      - name: Compile and run the text probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_text_probe.m -o cg_text_probe
          ./cg_text_probe 2>&1
      - name: Compile and run the data provider probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework CoreFoundation \
            Tests/oracle/cg_dataprovider_probe.m -o cg_dataprovider_probe
          ./cg_dataprovider_probe 2>&1
      - name: Compile and run the bitmap context probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_bitmapctx_probe.m -o cg_bitmapctx_probe
          ./cg_bitmapctx_probe 2>&1
      - name: Compile and run the pattern probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_pattern_probe.m -o cg_pattern_probe
          ./cg_pattern_probe 2>&1
      - name: Compile and run the fill colour space probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_fillcolorspace_probe.m -o cg_fillcolorspace_probe
          ./cg_fillcolorspace_probe 2>&1
      - name: Compile and run the clip probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_clip_probe.m -o cg_clip_probe
          ./cg_clip_probe 2>&1
      - name: Compile and run the blend mode probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_blend_probe.m -o cg_blend_probe
          ./cg_blend_probe 2>&1
      - name: Compile and run the geometry dictionary probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework Foundation \
            Tests/oracle/cg_geomdict_probe.m -o cg_geomdict_probe
          ./cg_geomdict_probe 2>&1
      - name: Compile and run the image properties probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ImageIO -framework Foundation \
            Tests/oracle/cg_imgprops_probe.m -o cg_imgprops_probe
          ./cg_imgprops_probe 2>&1
      - name: Compile and run the image copy-colorspace probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_imgcopycs_probe.m -o cg_imgcopycs_probe
          ./cg_imgcopycs_probe 2>&1
      - name: Compile and run the tiled image probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_tiled_probe.m -o cg_tiled_probe
          ./cg_tiled_probe 2>&1
      - name: Compile and run the clip mask probe
        run: |
          clang -Wno-deprecated-declarations \
            -framework CoreGraphics -framework ApplicationServices \
            Tests/oracle/cg_clipmask_probe.m -o cg_clipmask_probe
          ./cg_clipmask_probe 2>&1
